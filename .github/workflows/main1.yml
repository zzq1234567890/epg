name: EPG 综合更新流程

on:
  schedule:
    # 每小时 5 分触发（避开原独立触发时间，可自定义）
    - cron: '5 */1 * * *'
  workflow_dispatch:

jobs:
  full_update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 检出当前仓库
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------- 阶段一：epg.yml 内容 --------
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download files from files.json
        run: |
          cat files.json | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read -r filename url; do
            echo "Downloading $filename from $url"
            wget -O "$filename" "$url" --retry-connrefused --waitretry=5 --timeout=30 || echo "$filename 下载失败，跳过"
          done

      - name: Create unified time.txt (single line, Asia/Shanghai)
        run: |
          now_time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')
          echo "$now_time" > time.txt
          echo "Updated time.txt to: $now_time"

      # -------- 阶段二：epgnew.yml 内容 --------
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Generate epgnew.xml and epgnew.xml.gz
        run: php epgnew.php

      # 注意：原工作流会检出目标仓库副本，此处直接使用当前目录，无需额外检出
      # 只需将生成的文件添加到暂存区（稍后统一提交）

      # -------- 阶段三：code_20260301.yaml 内容 --------
      - name: Download XML files (twepg.xml, swepg.xml)
        run: |
          curl -L --retry 3 --max-time 10 -o twepg.xml https://raw.githubusercontent.com/zzq1234567890/epg/main/twepg.xml
          curl -L --retry 3 --max-time 10 -o swepg.xml https://raw.githubusercontent.com/zzq1234567890/epg/main/swepg.xml
          [ -s twepg.xml ] || { echo "twepg.xml 为空"; exit 1; }
          [ -s swepg.xml ] || { echo "swepg.xml 为空"; exit 1; }
          # 检查 time.txt 是否存在（已由阶段一创建）
          [ -s time.txt ] || { echo "time.txt 为空"; exit 1; }

      - name: Extract channel names, analyze, and update README
        run: |
          python <<'EOF'
          # 完整复制 code_20260301.yaml 中的 Python 分析脚本
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime
          import re
          import os

          def analyze_epg_data(xml_file):
              # ...（保持原有函数不变，此处省略以节省空间，实际使用时需完整复制）
              pass

          # 执行分析
          tw_data = analyze_epg_data('twepg.xml')
          sw_data = analyze_epg_data('swepg.xml')

          def generate_files(data, prefix):
              table_data = {
                  'title': f'{prefix}列表',
                  'headers': ['频道ID', '频道名称', '节目数量', '天数', '时间范围', '状态'],
                  'data': [[c['channel_id'], c['channel_name'], c['program_count'], c['duration_days'], c['time_range'], c['epg_status']] for c in data]
              }
              with open(f'{prefix}_channels_table.json', 'w', encoding='utf-8') as f:
                  json.dump(table_data, f, ensure_ascii=False, indent=2)

          generate_files(tw_data, 'traditional')
          generate_files(sw_data, 'simplified')

          def generate_readme():
              readme1_content = ""
              try:
                  if os.path.exists('README1.md'):
                      with open('README1.md', 'r', encoding='utf-8') as f:
                          readme1_content = f.read()
              except Exception as e:
                  print(f"❌ 读取 README1.md 出错: {e}")

              with open('time.txt', 'r', encoding='utf-8') as f:
                  current_time = f.read().strip()

              analysis_content = f"# 📺 EPG 電子節目表狀態報告\n\n"
              analysis_content += f"> 最後更新時間: **{current_time}**\n\n"
              analysis_content += "## 📊 統計摘要\n"
              analysis_content += f"- **繁體頻道數**: {len(tw_data)} (節目總數: {sum(x['program_count'] for x in tw_data)})\n"
              analysis_content += f"- **簡體頻道數**: {len(sw_data)} (節目總數: {sum(x['program_count'] for x in sw_data)})\n\n"

              for title, data in [("🇹🇼 繁體頻道列表", tw_data), ("🇨🇳 簡體頻道列表", sw_data)]:
                  analysis_content += f"## {title}\n\n"
                  analysis_content += "| 頻道名稱 | 節目數量 | 覆蓋天數 | 時間範圍 | 狀態 |\n"
                  analysis_content += "| :--- | :---: | :---: | :--- | :---: |\n"
                  for item in data:
                      status_icon = "✅" if item['epg_status'] == "■" else "⚠️"
                      count_display = item['program_count'] if item['program_count'] > 0 else "**0**"
                      row = f"| {item['channel_name']} | {count_display} | {item['duration_days']} 天 | {item['time_range']} | {status_icon} |\n"
                      analysis_content += row
                  analysis_content += "\n"

              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(readme1_content + "\n\n" + analysis_content)
              print("✅ README.md 已更新")

          generate_readme()
          EOF

      - name: Extract channel names (保持顺序)
        run: |
          python <<'EOF'
          import xml.etree.ElementTree as ET
          def extract(xml, out):
            try:
              tree = ET.parse(xml)
              root = tree.getroot()
              ns = {'ns': root.tag.split('}')[0][1:]} if root.tag.startswith('{') else {}
              seen = set()
              lines = []
              path = 'ns:channel' if ns else 'channel'
              for c in root.findall(path, ns):
                n = c.get('display-name')
                if not n:
                  ne = c.find('ns:display-name' if ns else 'display-name', ns)
                  n = ne.text.strip() if ne and ne.text else c.get('id')
                if n and n not in seen:
                  seen.add(n)
                  lines.append(n)
              with open(out, 'w', encoding='utf-8') as f:
                f.write('\n'.join(lines))
            except:
              pass
          extract('twepg.xml', '繁體電視台目錄.txt')
          extract('swepg.xml', '简体电视台目录.txt')
          EOF

      # -------- 统一提交所有更改 --------
      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 添加所有变更（包括新生成的文件和修改的文件）
          git add .
          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "⚠️ 没有需要提交的变更"
          else
            commit_time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            git commit -m "综合更新 EPG 数据，时间：$commit_time"
            for i in {1..3}; do
              git pull --rebase && git push && exit 0 || sleep 5
            done
            exit 1
          fi