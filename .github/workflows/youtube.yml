name: Update YouTube m3u8 Playlist

on:
  schedule:
    - cron: '0 */3 * * *'          # 每 3 小時執行一次
  workflow_dispatch:               # 允許手動觸發

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 必須有寫入權限才能 push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp

      - name: Write cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "::error::沒有設定 YOUTUBE_COOKIES secret，請先到 Settings → Secrets 新增"
            exit 1
          fi
          # 把 secret 寫成 cookies.txt
          printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
          echo "cookies.txt 已成功寫入 ($(wc -l < cookies.txt) 行)"

      - name: Run conversion script
        run: |
          python generate_m3u.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只提交產出的 m3u 檔案
          if [ -f youtubeworld_m3u8.m3u ]; then
            git add youtubeworld_m3u8.m3u
            if git diff --staged --quiet; then
              echo "檔案沒有變更，跳過 commit"
            else
              git commit -m "chore: update youtubeworld_m3u8.m3u $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push
              echo "已成功推送更新"
            fi
          else
            echo "找不到輸出檔案 youtubeworld_m3u8.m3u"
            exit 1
          fi
