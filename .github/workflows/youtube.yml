name: Update M3U with m3u8 Streams

on:
  schedule:
    - cron: "0 */6 * * *"    # 每 6 小时运行一次
  workflow_dispatch:         # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install yt-dlp

      - name: 运行生成脚本
        run: python generate_m3u.py

      - name: 上传生成的文件到仓库
        run: |
          # 如果 output.m3u 存在，复制到目标目录（可修改）
          # 示例：复制到仓库根目录下的 streams/ 文件夹
          mkdir -p streams
          cp output.m3u streams/iptv.m3u

      - name: 提交并推送更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streams/iptv.m3u || true
          git diff --staged --quiet || git commit -m "chore: update m3u with latest m3u8 streams [skip ci]"
          git push
